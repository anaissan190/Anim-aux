<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#F2820F" />
    <!-- viewport-fit=cover est nécessaire pour que env(safe-area-inset-bottom)
         (utilisé par MobileTabBar/DoctorMobileTabBar pour ne pas chevaucher
         l'indicateur d'accueil iOS) ne reste pas bloqué à 0 — sans lui,
         Safari n'applique jamais les insets de zone de sécurité. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Animéaux — Votre rendez-vous animal</title>
    <meta name="description" content="Trouvez un praticien du secteur animalier (vétérinaire, toiletteur, ostéopathe, éducateur canin...) près de chez vous et prenez rendez-vous en ligne en quelques clics." />
    <!-- Les polices sont auto-hébergées (src/index.css) : plus de requête vers
         Google Fonts, qui envoyait l'adresse IP de chaque visiteur à Google
         (RGPD) pour une police, Inter, qui n'est plus utilisée depuis la refonte
         du 07/09/2026. -->
    <link rel="canonical" href="https://monanimeaux.fr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Animéaux" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://monanimeaux.fr/" />
    <meta property="og:title" content="Animéaux — Votre rendez-vous animal" />
    <meta property="og:description" content="Trouvez un praticien du secteur animalier (vétérinaire, toiletteur, ostéopathe, éducateur canin...) près de chez vous et prenez rendez-vous en ligne en quelques clics." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Animéaux — Votre rendez-vous animal" />
    <meta name="twitter:image" content="https://monanimeaux.fr/og-image.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
