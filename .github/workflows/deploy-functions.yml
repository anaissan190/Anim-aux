name: Déployer les fonctions Edge

# Se déclenche uniquement quand du code de fonction Edge change sur main —
# et seulement après que les tests soient passés (job "tester" en premier,
# "deployer" en dépend). Élimine le copier-coller manuel dans le dashboard
# Supabase, qui a causé la plupart des bugs de secrets désynchronisés du
# 22/09/2026 (voir CLAUDE.md et supabase/config.toml).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  tester:
    runs-on: ubuntu-latest
    # Valeurs factices : certains tests (authStore, supabase.ts) importent
    # le vrai client Supabase sans le mocker (ils ne stubbent que ses
    # méthodes, jamais de vrai appel réseau) — le module lève une erreur à
    # la construction si ces variables sont absentes, ce qu'il n'y a jamais
    # localement grâce à .env.local (inexistant en CI). Aucune vraie
    # information ici, juste de quoi satisfaire la vérification.
    env:
      VITE_SUPABASE_URL: https://fake-project.supabase.co
      VITE_SUPABASE_ANON_KEY: fake-anon-key-for-ci
      VITE_VAPID_PUBLIC_KEY: fake-vapid-public-key-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm install plutôt que npm ci : ce dernier exige une correspondance
      # stricte et complète du lock file pour CHAQUE plateforme possible des
      # dépendances optionnelles d'esbuild (linux/win32/netbsd/...), ce qui
      # s'est avéré cassant à générer de façon fiable depuis un Mac (repéré
      # le 22/09/2026, plusieurs tentatives infructueuses) — npm install
      # complète les entrées manquantes à la volée sans échouer.
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vitest run

  deployer:
    needs: tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref agjuakrtqfddkfoocbof
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
